<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>半導體技術研究資料庫｜天空研究室</title>
<!-- 樣式：1 變數 → 2 全站共用 → 3 首頁 -->
<link rel="stylesheet" href="assets/css/1-tokens.css">
<link rel="stylesheet" href="assets/css/2-base.css">
<link rel="stylesheet" href="assets/css/3-home.css">
<!-- 設定與資料 → 共用程式（頂欄、頁尾、深淺色、統計數字） -->
<script src="settings/site.js"></script>
<script src="generated/stats.js"></script>
<script src="assets/js/layout.js"></script>
</head>
<body data-page="home" data-root=".">

<!-- 頂欄：內容在 settings/site.js -->
<header id="site-header"></header>

<main class="wrap">
<section class="hero">
  <div>
    <!-- ════ 大標題與介紹 ════ -->
    <h1 class="serif">半導體技術研究資料庫</h1>
    <p class="lede">從技術原理一路讀到製程、量產瓶頸與供應鏈。每個重要說法都連回來源，並標明目前成立到什麼程度。</p>

    <!-- ════ 入口 ════ -->
    <div class="entries">
      <a href="pages/landscape.html"><b>看全景 →</b><span>先知道一項技術位在產業的哪一塊，以及各主題目前收錄了哪些內容</span></a>
      <a href="pages/domains.html"><b>深入一個主題 →</b><span>從五個研究領域選一個，看它在問什麼、目前答到哪裡</span></a>
    </div>

    <!-- ════ 搜尋框 ════ -->
    <label class="qlabel" for="q">已經有想查的說法？</label>
    <form class="qbox" role="search" onsubmit="return false">
      <input id="q" type="search" placeholder="搜尋技術、公司或主張，例如：翹曲、TGV、光纖耦合">
      <button type="submit">搜尋</button>
    </form>

    <!-- ════ 統計列：數字由 tools/update_stats.py 自動填 ════ -->
    <p class="stats"><span data-stat="paths">0</span> 條閱讀路徑 · 全景 <span data-stat="topics">0</span> 個主題、<span data-stat="tech">0</span> 個已有技術頁 · 更新至 <span data-stat="updated">—</span></p>
  </div>

  <!-- ════ 形象圖 ════ -->
  <figure class="herofig">
    <img src="assets/images/hero.webp" width="1024" height="1365" alt="靜物：晶圓、裸晶粒、分層的材料方塊、封裝好的晶片，以及玻璃板、玻璃長條與圓形玻璃片，各自擺在石檯上">
    <figcaption>形象圖：呈現本資料庫涵蓋的研究對象，包括晶圓與晶粒、材料、封裝與玻璃樣品；圖中配置僅作概念示意，<b>不代表任何產品架構或組裝關係</b>。</figcaption>
  </figure>
</section>
</main>

<!-- 頁尾：內容在 settings/site.js -->
<footer id="site-footer"></footer>
</body>
</html>
